---
version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/aws"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: "terraform"
    directory: "/grafana"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: "terraform"
    directory: "/gcp"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: "terraform"
    directory: "/github"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: "terraform"
    directory: "/docker"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: "terraform"
    directory: "/healthchecks"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    reviewers:
      - 'femiwiki/reviewer'
    groups:
      actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'femiwiki/*'
    cooldown:
      default-days: 7
      # A week guards against a bad third-party release; ours, like tacos, skip it
      exclude:
        - 'femiwiki/*'
