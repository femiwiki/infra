---
name: Forward a port over SSM
description: >-
  Forwards an instance's port over SSM to the same port on the runner's
  127.0.0.1, and relays it on the docker bridge gateway so a container action
  can reach it too.
inputs:
  filters:
    description: >-
      The describe-instances filters, space-separated, that pick the one
      running instance whose port to reach.
    required: true
  region:
    description: The region that instance is in.
    required: true
  port:
    description: The port, on the instance and on the runner.
    required: true
  probe:
    description: >-
      A bash command that succeeds once the service answers on $HOST:$PORT. An
      accepted connection alone proves nothing: the tunnel accepts before the
      far side answers.
    required: true
outputs:
  address:
    description: The host:port to use from a container action.
    value: ${{ steps.relay.outputs.address }}
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      id: plugin
      with:
        path: ~/.cache/session-manager-plugin.deb
        key: session-manager-plugin-${{ env.SESSION_MANAGER_PLUGIN_VERSION }}-ubuntu_64bit
      env:
        SESSION_MANAGER_PLUGIN_VERSION: 1.2.835.0

    - name: Download the Session Manager plugin
      if: steps.plugin.outputs.cache-hit != 'true'
      shell: bash
      env:
        SESSION_MANAGER_PLUGIN_VERSION: 1.2.835.0
        SESSION_MANAGER_PLUGIN_SHA256: 7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03
      run: |
        mkdir -p ~/.cache
        curl -sSfLo ~/.cache/session-manager-plugin.deb "https://s3.amazonaws.com/session-manager-downloads/plugin/${SESSION_MANAGER_PLUGIN_VERSION}/ubuntu_64bit/session-manager-plugin.deb"
        echo "${SESSION_MANAGER_PLUGIN_SHA256}  $HOME/.cache/session-manager-plugin.deb" | sha256sum -c -

    - name: Install the Session Manager plugin and socat
      shell: bash
      run: |
        sudo dpkg -i ~/.cache/session-manager-plugin.deb > /dev/null
        command -v socat > /dev/null || sudo apt-get install -y -q socat > /dev/null

    - name: Forward the port
      id: forward
      shell: bash
      env:
        FILTERS: ${{ inputs.filters }}
        AWS_REGION: ${{ inputs.region }}
        PORT: ${{ inputs.port }}
        PROBE: ${{ inputs.probe }}
      run: |
        instance=$(aws ec2 describe-instances \
          --filters $FILTERS Name=instance-state-name,Values=running \
          --query 'Reservations[].Instances[].InstanceId' --output text)
        [ -n "$instance" ] || { echo "::error::no running instance matches $FILTERS in $AWS_REGION"; exit 1; }
        nohup aws ssm start-session --target "$instance" \
          --document-name AWS-StartPortForwardingSession \
          --parameters "portNumber=$PORT,localPortNumber=$PORT" > /tmp/ssm-session.log 2>&1 &
        # Read before the wait below and left in a file rather than a step
        # output: a session that never carries traffic still exists and still
        # has to be closed, and a composite action that fails does not reliably
        # carry its outputs. The tunnel failing to come up is exactly when this
        # was leaking. The id reaches the log about a second after the start.
        rm -f /tmp/ssm-session-id
        for _ in $(seq 10); do
          awk '/^Starting session with SessionId: /{print $NF; exit}' /tmp/ssm-session.log > /tmp/ssm-session-id
          if [ -s /tmp/ssm-session-id ]; then
            echo "Session $(cat /tmp/ssm-session-id), to be closed by the caller."
            break
          fi
          sleep 1
        done
        if [ ! -s /tmp/ssm-session-id ]; then
          echo "::warning::the session id never appeared in the log, so nothing can close this session."
        fi
        # The probe needs its own timeout, or a silent tunnel stalls the first
        # iteration for ever (femiwiki/infra#901).
        for _ in $(seq 30); do
          if HOST=127.0.0.1 bash -c "$PROBE" > /dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "::error::the port forward did not come up"; cat /tmp/ssm-session.log; exit 1

    - name: Relay it on the bridge gateway for container actions
      id: relay
      shell: bash
      env:
        PORT: ${{ inputs.port }}
        PROBE: ${{ inputs.probe }}
      run: |
        gateway=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
        nohup socat "TCP-LISTEN:$PORT,bind=$gateway,fork,reuseaddr" "TCP:127.0.0.1:$PORT" > /tmp/socat.log 2>&1 &
        sleep 1
        HOST=$gateway bash -c "$PROBE" > /dev/null
        echo "address=$gateway:$PORT" >> "$GITHUB_OUTPUT"
