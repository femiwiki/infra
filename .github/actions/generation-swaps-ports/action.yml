---
name: A new generation has to swap the ports it binds
description: >-
  Refuses any fastcgi_generation but the one the next swap needs. The ports
  every container binds alternate on generation % 2, and create_before_destroy
  has both generations alive at once, so the new number needs the parity
  opposite to the generation serving, the healthy one; and it has to be above
  every fastcgi name on the host, running or not, or it reuses a name that
  exists. Normally that is the serving generation plus one. After a swap whose
  new generation never became healthy, that generation keeps its name but not
  its port, so the next is the serving one plus three. Needs the docker-daemon
  action to have run, since the numbers are read off the host rather than off
  main, which sits one behind whenever something is applied but not yet merged.
inputs:
  workspace:
    description: The root whose locals.tf to read.
    required: true
runs:
  using: composite
  steps:
    - name: Compare the branch's generation with the one the next swap needs
      shell: bash
      env:
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        gen=$(grep -oE 'fastcgi_generation = [0-9]+' "$WORKSPACE/locals.tf" | grep -oE '[0-9]+$')
        [ -n "$gen" ] || { echo "::error::no fastcgi_generation in $WORKSPACE/locals.tf"; exit 1; }
        generations() {
          curl -sf --get --data-urlencode "$1" http://127.0.0.1:2376/containers/json \
            | jq -r '.[].Names[]' \
            | grep -oE '^/fastcgi-[0-9]+$' | grep -oE '[0-9]+$' | sort -n | tail -1 || true
        }
        highest=$(generations all=true)
        serving=$(generations 'filters={"health":["healthy"]}')
        if [ -z "$highest" ]; then
          echo "No fastcgi container exists, so there is nothing for generation $gen to collide with."
          exit 0
        fi
        if [ -z "$serving" ]; then
          echo "::warning::no fastcgi container is healthy, so the highest, $highest, is taken as the one serving."
          serving=$highest
        fi
        if [ "$gen" -eq "$serving" ] && [ "$gen" -eq "$highest" ]; then
          echo "Generation $gen is the one serving; this pull request does not swap it."
          exit 0
        fi
        want=$((highest + 1))
        if [ $(( (want - serving) % 2 )) -eq 0 ]; then
          want=$((want + 1))
        fi
        if [ "$gen" -ne "$want" ]; then
          echo "::error::$WORKSPACE asks for generation $gen. $serving is serving and the highest fastcgi name on the host is $highest, so the next swap has to be $want. Lower reuses a name or the serving ports; higher skips swaps a stacked pull request has not applied. Update the branch, or apply the pull request that took it first."
          exit 1
        fi
        if [ "$highest" -ne "$serving" ]; then
          echo "fastcgi-$highest exists but is not healthy, so generation $gen takes the ports it would have held."
        fi
        echo "Generation $gen swaps the ports generation $serving holds."
