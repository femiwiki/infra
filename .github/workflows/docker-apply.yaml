---
name: docker apply
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions: {}
concurrency:
  group: docker
jobs:
  apply:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request && contains(fromJSON('["terraform apply", "tofu apply"]'), github.event.comment.body))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: docker
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Only a collaborator with write access, only a branch of this repository
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          USER: ${{ github.event.comment.user.login }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$USER/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo "::error::$USER has $permission access"; exit 1 ;; esac
          [ "$(gh pr view "$PR" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)" = false ] || { echo "::error::PR #$PR is from a fork"; exit 1; }
          gh api --method POST "repos/$REPO/issues/comments/$COMMENT/reactions" -f content=eyes > /dev/null

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}
          persist-credentials: false

      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        with:
          webhook: ${{ secrets.DOCKER_DISCORD_WEBHOOK }}
          title: Applying
          color: 0x3498db
          nodetail: true
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ github.event.issue.html_url || github.ref_name }} by ${{ github.actor }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/infra-docker
          aws-region: ap-northeast-1

      - uses: ./.github/actions/docker-daemon
        id: daemon

      - name: Pull the images the plan will start
        run: |
          grep -ohE 'image\s*=\s*"[^"]+"' docker/container.tf | grep -oE '"[^"]+"' | tr -d '"' | sort -u | while read -r image; do
            curl -sf -X POST "http://127.0.0.1:2376/images/create?fromImage=${image%%:*}&tag=${image##*:}" > /dev/null
          done

      - uses: dflook/terraform-apply@82a1042d40c66856406bf648832fc5d6b03ca74c  # v3.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_VAR_docker_host: ${{ steps.daemon.outputs.host }}
        with:
          path: docker
          auto_approve: ${{ github.event_name == 'workflow_dispatch' }}

      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        if: always()
        with:
          webhook: ${{ secrets.DOCKER_DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: ${{ case(job.status == 'success', 'Applied', job.status == 'cancelled', 'Cancelled', 'Errored') }}
          nodetail: true
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ github.event.issue.html_url || github.ref_name }} by ${{ github.actor }}
