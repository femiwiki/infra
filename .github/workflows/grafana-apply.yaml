---
name: grafana apply
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
permissions: {}
concurrency:
  group: grafana
jobs:
  scope:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request && github.event.comment.body == 'tofu apply')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      apply: ${{ steps.files.outputs.apply }}
    steps:
      - name: Only a pull request that changes this workspace
        id: files
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          apply=true
          if [ "$EVENT" = issue_comment ]; then
            gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' | grep -q '^grafana/' || apply=false
          fi
          echo "apply=$apply" >> "$GITHUB_OUTPUT"

  apply:
    needs: scope
    if: needs.scope.outputs.apply == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: grafana
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Only a collaborator with write access, only a branch of this repository
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          USER: ${{ github.event.comment.user.login }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$USER/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo "::error::$USER has $permission access"; exit 1 ;; esac
          [ "$(gh pr view "$PR" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)" = false ] || { echo "::error::PR #$PR is from a fork"; exit 1; }
          gh api --method POST "repos/$REPO/issues/comments/$COMMENT/reactions" -f content=eyes > /dev/null

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        id: checkout
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.ref }}
          persist-credentials: false

      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        with:
          webhook: ${{ secrets.GRAFANA_DISCORD_WEBHOOK }}
          title: Applying
          color: 0x3498db
          nodetail: true
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ github.event.issue.html_url || github.ref_name }} by ${{ github.actor }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/infra-grafana
          aws-region: ap-northeast-1

      - uses: dflook/tofu-apply@e3e5dfc8f935d4b152c767801046f63abf8a77d3  # v3.1.0
        id: apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_APPLY_TOKEN }}
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          path: grafana
          auto_approve: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Say what actually happened
        id: outcome
        if: always()
        env:
          STATUS: ${{ job.status }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          APPLY: ${{ steps.apply.outcome }}
          PLAN: ${{ steps.apply.outputs.json_plan_path }}
          SUBJECT: ${{ github.event.issue.html_url || github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          title=Errored
          color=
          note=
          if [ "$STATUS" = cancelled ]; then
            title=Cancelled
          elif [ "$CHECKOUT" = failure ]; then
            title='Not applied'
            color=0xe67e22
            note=' - the pull request merged before this could check it out, so tofu never ran'
          elif [ "$APPLY" = success ]; then
            title=Applied
            if [ -n "$PLAN" ] && [ -f "$PLAN" ] &&
              [ "$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' "$PLAN")" = 0 ]; then
              title='No changes'
            fi
          fi
          {
            echo "title=$title"
            echo "color=$color"
            echo "description=$SUBJECT by $ACTOR$note"
          } >> "$GITHUB_OUTPUT"

      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        if: always()
        with:
          webhook: ${{ secrets.GRAFANA_DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: ${{ steps.outcome.outputs.title }}
          color: ${{ steps.outcome.outputs.color }}
          nodetail: true
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.outcome.outputs.description }}

  replan:
    needs: apply
    if: needs.apply.result == 'success' && github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run the plan so the merge gate sees what was just applied
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          run=$(gh api "repos/$REPO/actions/workflows/grafana-plan.yaml/runs?head_sha=$sha" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            echo "::warning::no grafana plan run for $sha to re-run"
            exit 0
          fi
          gh api --method POST "repos/$REPO/actions/runs/$run/rerun" \
            || echo "::warning::could not re-run grafana plan $run"
