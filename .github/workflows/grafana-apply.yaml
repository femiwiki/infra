---
name: grafana apply
on:
  push:
    branches: ["main"]
    paths: ["grafana/**"]
permissions: {}
concurrency:
  group: grafana
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: grafana
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/infra-grafana
          aws-region: ap-northeast-1

      - uses: dflook/tofu-apply@e3e5dfc8f935d4b152c767801046f63abf8a77d3  # v3.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_APPLY_TOKEN }}
        with:
          path: grafana
          auto_approve: true
