---
# Merging is restricted to this app, so that nothing reaches the default branch
# ahead of the apply that has to precede it. This is the path for the pull
# requests no apply reaches: the workspaces Terraform Cloud applies on merge,
# and everything outside a workspace.
name: Merge

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  merge:
    name: Merge the pull request
    if: github.event.issue.pull_request && github.event.comment.body == 'merge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # issue_comment runs with a write token on the default branch, so anyone
      # who can comment can start this. Only someone who could have merged it
      # by hand may.
      - name: The comment has to come from someone who can write here
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)
          case "$perm" in
            admin | maintain | write) echo "$COMMENTER has $perm." ;;
            *)
              echo "::error::$COMMENTER has $perm on $REPO, so this comment merges nothing."
              exit 1
              ;;
          esac

      - name: A workspace that is applied before it merges goes through 'tofu apply'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          applied=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | grep -oE '^(docker|grafana|healthchecks)/' | tr -d / | sort -u | tr '\n' ' ')
          if [ -n "$applied" ]; then
            echo "::error::#$PR changes $applied, which is applied before it merges, and applying merges it. Comment 'tofu apply' instead."
            exit 1
          fi
          echo "Nothing here waits on an apply."

      # Branch protection still holds the lint checks, so a red pull request
      # fails here rather than merging.
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: gh pr merge "$PR" --repo "$REPO" --squash
