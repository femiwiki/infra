---
name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef  # v6.3.1
        with:
          tflint_version: latest

      - run: tflint --recursive --config="$PWD/.tflint.hcl" --format=compact

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - run: shellcheck --version

      - run: git ls-files -z '*.sh' | xargs -0 shellcheck

  rumdl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: rvben/rumdl@bb84a49a85625b31ecf6c3e58b7bca7c75fbfefb  # v0.2.77
        with:
          version: 0.2.77

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - run: uv run --frozen --group lint yamllint --strict .

  parallel-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: parallel-lint:1.4.0
          coverage: none

      - run: parallel-lint .

  taplo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91  # v2

      - run: taplo fmt --check

      - run: taplo lint

  caddyfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The caddy and the plugins the http container runs, and the port
      # variables the Caddyfile reads, which come from that image's ENV rather
      # than from caddy. `caddy validate` would go on to provision the s3
      # storage, which needs credentials, so this stops at adapting.
      - id: image
        run: echo "image=$(grep -m1 -oE 'ghcr\.io/femiwiki/femiwiki:[^"]+' docker/container.tf)" >> "$GITHUB_OUTPUT"

      # The 2.87 GB image is pulled once per tag; later runs restore about
      # 40 MB of its binary from this cache
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: cache
        with:
          path: ~/.cache/fw-caddy
          key: fw-caddy-${{ steps.image.outputs.image }}

      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          mkdir -p ~/.cache/fw-caddy
          container=$(docker create "$IMAGE")
          docker cp "$container:/usr/bin/caddy" ~/.cache/fw-caddy/caddy
          docker rm -f "$container" > /dev/null
          # A wrapper with the ports baked in, so the step below needs no image
          # and nothing to source.
          {
            echo '#!/bin/sh'
            docker inspect "$IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -E '^(PHP_FPM_LISTEN|PHP_FPM_PROBE_LISTEN|PHP_FPM_STATUS_LISTEN|FW_PROBE_PORT|FW_METRICS_PORT)=' \
              | sed 's/^/export /'
            # shellcheck disable=SC2016
            echo 'exec "$(dirname "$0")/caddy" "$@"'
          } > ~/.cache/fw-caddy/caddy-with-ports

      - name: Adapt and format the Caddyfile with that caddy
        run: |
          chmod +x ~/.cache/fw-caddy/caddy ~/.cache/fw-caddy/caddy-with-ports
          ~/.cache/fw-caddy/caddy-with-ports adapt --adapter caddyfile --config serving/Caddyfile > /dev/null
          # --diff prints the whole file, so show only the lines that differ
          if ! diff=$(~/.cache/fw-caddy/caddy-with-ports fmt --diff serving/Caddyfile); then
            grep -nE '^[-+]' <<< "$diff"
            echo "::error file=serving/Caddyfile::not formatted; run caddy fmt --overwrite"
            exit 1
          fi

  long-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Opengrep
        env:
          VERSION: v1.30.0
          SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/$VERSION/opengrep_manylinux_x86"
          echo "$SHA256  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep"

      # Only blocks the change adds fail; the ones already on the base stay
      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          "$RUNNER_TEMP/opengrep" scan --config .semgrep \
            --baseline-commit "$BASE" --error .

  gate:
    name: lint gate
    needs: [tflint, shellcheck, rumdl, yamllint, parallel-lint, taplo, caddyfile, long-comments, shared-lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job this gate stands for has to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::$(echo "$failed" | paste -sd' ')"
            exit 1
          fi
          echo "All green."

  shared-lint:
    uses: femiwiki/.github/.github/workflows/shared-lint.yml@243836c393e62e7887baad11dd1619dcc1bb0fac
    permissions:
      contents: read
