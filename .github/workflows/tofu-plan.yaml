---
name: tofu plan
on:
  workflow_call:
    inputs:
      workspace:
        description: The directory holding the workspace, which also names its IAM role and its GitHub environment.
        required: true
        type: string
      ssm_docker_tunnel:
        description: Forward the docker instance's daemon port before planning.
        type: boolean
        default: false
    secrets:
      grafana_auth:
        required: false
      discord_webhook_url:
        required: false
      healthchecksio_api_key:
        required: false
    outputs:
      scope:
        description: Whether this pull request changes the workspace at all.
        value: ${{ jobs.scope.outputs.plan }}
      changes:
        description: Whether the plan still has anything to apply.
        value: ${{ jobs.plan.outputs.changes }}
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      plan: ${{ steps.files.outputs.plan }}
    steps:
      - name: Only a pull request that changes this workspace
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          plan=true
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | grep -qE "^($WORKSPACE/|\.github/(workflows/(tofu|$WORKSPACE)-plan\.yaml$|actions/))" || plan=false
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  plan:
    needs: scope
    if: needs.scope.outputs.plan == 'true'
    # Only the plan is worth cancelling. Cancelling the whole run would take
    # the gate in the caller with it, and a gate that never ran is a required
    # check that never passes.
    concurrency:
      group: ${{ inputs.workspace }}-${{ github.event.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/infra-${{ inputs.workspace }}
          aws-region: ap-northeast-1

      - uses: ./.github/actions/docker-daemon
        if: inputs.ssm_docker_tunnel
        id: daemon

      - uses: dflook/tofu-plan@c7416238983bdd94c5486fb856bb7358f2bcc935  # v3.1.0
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_PLAN_COLLAPSE_LENGTH: "100000"  # never collapse the plan
          TF_VAR_docker_host: ${{ steps.daemon.outputs.host }}
          TF_VAR_grafana_auth: ${{ secrets.grafana_auth }}
          TF_VAR_discord_webhook_url: ${{ secrets.discord_webhook_url }}
          TF_VAR_healthchecksio_api_key: ${{ secrets.healthchecksio_api_key }}
        with:
          path: ${{ inputs.workspace }}
