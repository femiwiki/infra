---
name: docker plan
on:
  pull_request:
    paths: ["docker/**", ".github/workflows/docker-plan.yaml", ".github/actions/docker-daemon/**"]
permissions: {}
concurrency:
  group: docker-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/infra-docker
          aws-region: ap-northeast-1

      - uses: $/.github/actions/docker-daemon
        id: daemon

      - uses: dflook/terraform-plan@48e90468aecdd1d8ea21617d4cecf0cd7746ff1d  # v3.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_VAR_docker_host: ${{ steps.daemon.outputs.host }}
        with:
          path: docker
