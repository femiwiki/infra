---
name: tofu
on:
  pull_request:
  workflow_dispatch:
    inputs:
      workspace:
        description: The workspace to apply from this branch, once its environment approves.
        required: true
        type: choice
        options: &workspaces [docker, github, grafana, healthchecks]
permissions: {}
jobs:
  plan:
    # No concurrency group on purpose: a cancelled plan fails the gate below,
    # and the gate is the required check.
    name: ${{ matrix.workspace }} plan
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        workspace: *workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: The branch has to carry everything on its base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          base=$(gh pr view "$PR" --repo "$REPO" --json baseRefName --jq .baseRefName)
          head=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          behind=$(gh api "repos/$REPO/compare/$base...$head" --jq .behind_by)
          if [ "$behind" -gt 0 ]; then
            echo "::error::#$PR is $behind commits behind $base, so a plan from it describes a tree that no longer exists and applying it would undo what landed meanwhile. Update the branch, then plan again."
            exit 1
          fi
          echo "Up to date with $base."

      - name: Only a pull request that changes this workspace
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          plan=true
          # serving/ holds the Caddyfile, Hotfix.php and robots.txt that every
          # docker workspace renders into container environment variables, so a
          # change there has to reach all of them, not just one region's.
          shared=
          case "$WORKSPACE" in docker*) shared="|^serving/" ;; esac
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | grep -qE "^($WORKSPACE/|\.github/(workflows/tofu\.yaml$|actions/)$shared)" || plan=false
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          [ "$plan" = true ] || echo "This pull request does not change $WORKSPACE/."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        if: steps.scope.outputs.plan == 'true'
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        if: steps.scope.outputs.plan == 'true'
        with:
          role-to-assume: arn:aws:iam::302617221463:role/infra-${{ matrix.workspace }}
          aws-region: ap-northeast-1

      - uses: ./.github/actions/docker-daemon
        if: steps.scope.outputs.plan == 'true' && startsWith(matrix.workspace, 'docker')
        id: daemon
        with:
          instance-tag: ${{ matrix.workspace }}
          region: ap-northeast-2

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        if: steps.scope.outputs.plan == 'true' && matrix.workspace == 'github'
        id: app-token
        with:
          client-id: ${{ vars.TOFU_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.TOFU_GITHUB_APP_PEM }}
          # This root manages every repository in the organisation, so the token
          # is bounded by permission rather than by repository. Listing them here
          # would be a second copy of github/repo.tf, drifting from the first.
          owner: femiwiki  # zizmor: ignore[github-app]
          permission-administration: write
          permission-environments: write
          permission-issues: write
          permission-members: write
          permission-pages: write

      - uses: ./.github/actions/generation-swaps-ports
        if: steps.scope.outputs.plan == 'true' && startsWith(matrix.workspace, 'docker')
        with:
          workspace: ${{ matrix.workspace }}

      - uses: dflook/tofu-plan@c7416238983bdd94c5486fb856bb7358f2bcc935  # v3.1.0
        if: steps.scope.outputs.plan == 'true'
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_PLAN_COLLAPSE_LENGTH: "100000"  # never collapse the plan
          TF_VAR_docker_host: ${{ steps.daemon.outputs.host }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
          TF_VAR_grafana_auth: ${{ matrix.workspace == 'grafana' && secrets.GRAFANA_PLAN_TOKEN || '' }}
          TF_VAR_discord_webhook_url: ${{ matrix.workspace == 'grafana' && secrets.DISCORD_WEBHOOK_URL || '' }}
          TF_VAR_mastodon_token: ${{ matrix.workspace == 'grafana' && secrets.MASTODON_TOKEN || '' }}
          TF_VAR_healthchecksio_api_key: ${{ matrix.workspace == 'healthchecks' && secrets.HEALTHCHECKSIO_API_KEY || '' }}
        with:
          path: ${{ matrix.workspace }}

      - name: Whether there is anything to apply
        id: changes
        if: steps.scope.outputs.plan == 'true'
        env:
          CHANGES: ${{ steps.plan.outputs.changes }}
          PLAN: ${{ steps.plan.outputs.json_plan_path }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          # A plan that only moves resources can still count as having no changes
          pending=$(jq '[.resource_changes[]? | select(.change.importing or .previous_address)] | length' "$PLAN")
          if [ "$CHANGES" = true ] || [ "$pending" -gt 0 ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
            echo "The plan has changes, so $WORKSPACE apply waits for its environment to approve them."
            exit 0
          fi
          # With nothing left to import or move, such a block has done its job
          if grep -rnE '^(import|moved) \{' --include='*.tf' "$WORKSPACE"; then
            echo "::warning::applied, so the import and moved blocks above can go."
          fi
          echo "The plan is empty."

      # A matrix job has one set of outputs for all of its legs, so the pending
      # job reads this step's conclusion in each leg instead. Keep the name.
      - name: Changes to apply
        if: steps.changes.outputs.apply == 'true'
        run: echo "Queued for the apply job."

      - uses: ./.github/actions/collapse-comments
        if: always() && steps.plan.outcome != 'skipped'
        with:
          pull-request: ${{ github.event.number }}

      - name: Close the SSM session, which outlives the runner
        if: always() && startsWith(matrix.workspace, 'docker')
        env:
          AWS_REGION: ap-northeast-2
        run: |
          # Nine were left Connected across both regions on 2026-09-27, from
          # runs that had finished; see #901.
          [ -s /tmp/ssm-session-id ] || { echo "No session was opened, so there is none to close."; exit 0; }
          sid=$(cat /tmp/ssm-session-id)
          aws ssm terminate-session --session-id "$sid" --output text \
            || echo "::warning::could not terminate $sid; it may have ended already."

  # One gate so a new job or a new workspace never needs a branch protection
  # change. Registering a context that nothing reports blocks every pull request,
  # which happened in femiwiki/infra#827, and this is what stops it recurring.
  #
  # The cost is that the list below is the thing to forget instead. Reading the
  # run's own check runs rather than naming them is the eventual answer; it needs
  # care because the gate is a check run too.
  #
  # Only a pull_request run may carry the required name. A run for any other
  # event skips this job but still reports it, and a skipped check counts as
  # passing, so a review-triggered run once satisfied the gate and let an
  # unapplied pull request merge (#870).
  #
  # While an apply waits for its environment's approval this job has not
  # started, and a required check that has not reported keeps the merge button
  # dead. Nothing reaches main unapplied that way.
  gate:
    name: ${{ github.event_name == 'pull_request' && 'tofu gate' || 'tofu gate (pull requests only)' }}
    needs: [plan, pending, apply]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job this gate stands for has to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          # apply alone may be skipped, which is what a run with nothing to apply does
          failed=$(echo "$RESULTS" | jq -r 'to_entries[]
            | select(.value.result != "success" and (.key != "apply" or .value.result != "skipped"))
            | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::$(echo "$failed" | paste -sd' ')"
            exit 1
          fi
          echo "All green."

  # Which workspaces to apply. On a pull request, those whose plan has
  # changes; the apply job then waits for each one's environment to approve.
  pending:
    needs: plan
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch'
      || (needs.plan.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    outputs:
      workspaces: ${{ steps.workspaces.outputs.workspaces }}
    steps:
      # Each push leaves a run behind, and one still waiting for approval would
      # apply a plan of a commit the pull request no longer has. The apply job
      # refuses that too; this keeps it from being offered at all.
      - name: Cancel this pull request's older runs that still wait for approval
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/actions/workflows/tofu.yaml/runs?event=pull_request&status=waiting&branch=$BRANCH" --paginate \
            --jq '.workflow_runs[] | select(.id < (env.RUN_ID | tonumber)) | .id' | while read -r run; do
            gh api --method POST "repos/$REPO/actions/runs/$run/cancel" \
              && echo "Cancelled run $run" || echo "::warning::could not cancel run $run"
          done

      - name: The workspaces to apply, each behind an environment that asks first
        id: workspaces
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          WORKSPACE: ${{ inputs.workspace }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            workspaces=$(jq -nc --arg w "$WORKSPACE" '[$w]')
          else
            workspaces=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest" --paginate \
              --jq '.jobs[] | select(any(.steps[]?; .name == "Changes to apply" and .conclusion == "success")) | .name | sub(" plan$"; "")' \
              | jq -Rnc '[inputs]')
          fi
          # A job naming an environment that does not exist creates it without
          # any protection, and the apply would then run without asking anyone
          for w in $(echo "$workspaces" | jq -r '.[]'); do
            reviewers=$(gh api "repos/$REPO/environments/$w" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo 0)
            if [ "$reviewers" -eq 0 ]; then
              echo "::error::the $w environment has no required reviewers, so nothing would stop its apply. Add them in github/repo.tf."
              exit 1
            fi
          done
          echo "workspaces=$workspaces" >> "$GITHUB_OUTPUT"
          echo "Applying $workspaces"

  # The environment's required reviewers are what starts this job; approving
  # the run is the apply. No concurrency group: a job waiting for approval
  # would hold it and stall every other pull request's apply behind it. Two
  # applies of one workspace at once still cannot both run, because the second
  # fails on the S3 state lock.
  apply:
    name: ${{ matrix.workspace }} apply
    needs: pending
    if: needs.pending.outputs.workspaces != '[]'
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJSON(needs.pending.outputs.workspaces) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ startsWith(matrix.workspace, 'docker') && 20 || 10 }}
    environment: ${{ matrix.workspace }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
    steps:
      # Approval can come long after the plan, so check again what the plan
      # job checked when it ran.
      - name: The pull request is still what this run planned, and still current
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PLANNED: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          pr=$(gh api "repos/$REPO/pulls/$PR")
          if [ "$(echo "$pr" | jq .merged)" = true ]; then
            echo "::error::#$PR has merged, so there is no pull request left to apply. Apply $DEFAULT_BRANCH with workflow_dispatch instead."
            exit 1
          fi
          head=$(echo "$pr" | jq -r .head.sha)
          if [ "$head" != "$PLANNED" ]; then
            echo "::error::#$PR is at $head now, not $PLANNED, which this run planned. Approve the run for $head instead."
            exit 1
          fi
          base=$(echo "$pr" | jq -r .base.ref)
          if [ "$base" != "$DEFAULT_BRANCH" ]; then
            echo "::error::#$PR targets $base rather than $DEFAULT_BRANCH. An apply runs before the merge, so a plan from a stacked branch carries whatever is below it and applying this would apply those too. Merge the branch underneath first, retarget this one at $DEFAULT_BRANCH, then plan again."
            exit 1
          fi
          behind=$(gh api "repos/$REPO/compare/$base...$head" --jq .behind_by)
          if [ "$behind" -gt 0 ]; then
            echo "::error::#$PR is $behind commits behind $base, so a plan from it describes a tree that no longer exists and applying it would undo what landed meanwhile. Update the branch, then approve the new run."
            exit 1
          fi
          echo "Still $PLANNED, up to date with $base."

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Who approved this
        id: approver
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          by=$(gh api "repos/$REPO/actions/runs/$RUN_ID/approvals" --jq '[.[] | select(.state == "approved") | .user.login] | last // empty' || true)
          echo "by=${by:-$ACTOR}" >> "$GITHUB_OUTPUT"

      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        with:
          webhook: ${{ secrets.TOFU_DISCORD_WEBHOOK }}
          title: "${{ matrix.workspace }}: Applying"
          color: 0x3498db
          nodetail: true
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ github.event.pull_request.html_url || github.ref_name }} by ${{ steps.approver.outputs.by }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/infra-${{ matrix.workspace }}
          aws-region: ap-northeast-1

      - uses: ./.github/actions/docker-daemon
        if: startsWith(matrix.workspace, 'docker')
        id: daemon
        with:
          instance-tag: ${{ matrix.workspace }}
          region: ap-northeast-2

      - name: Pull the images the plan will start
        if: startsWith(matrix.workspace, 'docker')
        env:
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          grep -ohE 'image\s*=\s*"[^"]+"' "$WORKSPACE"/*.tf | grep -oE '"[^"]+"' | tr -d '"' | sort -u | while read -r image; do
            curl -sf -X POST "http://127.0.0.1:2376/images/create?fromImage=${image%%:*}&tag=${image##*:}" > /dev/null
          done

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        if: matrix.workspace == 'github'
        id: app-token
        with:
          client-id: ${{ vars.TOFU_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.TOFU_GITHUB_APP_PEM }}
          # This root manages every repository in the organisation, so the token
          # is bounded by permission rather than by repository. Listing them here
          # would be a second copy of github/repo.tf, drifting from the first.
          owner: femiwiki  # zizmor: ignore[github-app]
          permission-administration: write
          permission-environments: write
          permission-issues: write
          permission-members: write
          permission-pages: write

      - uses: ./.github/actions/generation-swaps-ports
        if: startsWith(matrix.workspace, 'docker')
        with:
          workspace: ${{ matrix.workspace }}

      - uses: dflook/tofu-apply@e3e5dfc8f935d4b152c767801046f63abf8a77d3  # v3.1.0
        id: apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_PLAN_COLLAPSE_LENGTH: "100000"  # never collapse the plan
          TF_VAR_docker_host: ${{ steps.daemon.outputs.host }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
          TF_VAR_grafana_auth: ${{ matrix.workspace == 'grafana' && secrets.GRAFANA_APPLY_TOKEN || '' }}
          TF_VAR_discord_webhook_url: ${{ matrix.workspace == 'grafana' && secrets.DISCORD_WEBHOOK_URL || '' }}
          TF_VAR_mastodon_token: ${{ matrix.workspace == 'grafana' && secrets.MASTODON_TOKEN || '' }}
          TF_VAR_healthchecksio_api_key: ${{ matrix.workspace == 'healthchecks' && secrets.HEALTHCHECKSIO_API_KEY || '' }}
        with:
          path: ${{ matrix.workspace }}
          auto_approve: ${{ github.event_name == 'workflow_dispatch' }}

      # A failed post does not fail an apply that has already changed production.
      # The next post carries the note, and the Discord message says it is owed.
      - name: Post the ```wikitext blocks of the applied pull request to the wiki
        if: github.event_name == 'pull_request' && matrix.workspace == 'docker'
        id: post
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_DEPLOY_BOT_USER: ${{ vars.WIKI_DEPLOY_BOT_USER }}
          WIKI_DEPLOY_BOT_PASSWORD: ${{ secrets.WIKI_DEPLOY_BOT_PASSWORD }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/scripts/post-update.php "$REPO" "$PR"

      # The apply has to leave nothing behind, because the required check that
      # used to say so is gone and this is what replaces it. Planning here rather
      # than in a fresh run keeps the tofu binary, the providers and the docker
      # daemon this job already set up.
      - uses: dflook/tofu-plan@c7416238983bdd94c5486fb856bb7358f2bcc935  # v3.1.0
        if: github.event_name == 'pull_request' && steps.apply.outcome == 'success'
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_PLAN_COLLAPSE_LENGTH: "100000"  # never collapse the plan
          TF_VAR_docker_host: ${{ steps.daemon.outputs.host }}
          TF_VAR_github_token: ${{ steps.app-token.outputs.token }}
          TF_VAR_grafana_auth: ${{ matrix.workspace == 'grafana' && secrets.GRAFANA_PLAN_TOKEN || '' }}
          TF_VAR_discord_webhook_url: ${{ matrix.workspace == 'grafana' && secrets.DISCORD_WEBHOOK_URL || '' }}
          TF_VAR_mastodon_token: ${{ matrix.workspace == 'grafana' && secrets.MASTODON_TOKEN || '' }}
          TF_VAR_healthchecksio_api_key: ${{ matrix.workspace == 'healthchecks' && secrets.HEALTHCHECKSIO_API_KEY || '' }}
        with:
          path: ${{ matrix.workspace }}
          add_github_comment: changes-only

      - name: Nothing may be left for a later apply
        id: clean
        if: github.event_name == 'pull_request' && steps.apply.outcome == 'success'
        env:
          CHANGES: ${{ steps.verify.outputs.changes }}
          PLAN: ${{ steps.verify.outputs.json_plan_path }}
          WORKSPACE: ${{ matrix.workspace }}
        run: |
          # A plan that only moves resources can still count as having no changes
          pending=$(jq '[.resource_changes[]? | select(.change.importing or .previous_address)] | length' "$PLAN")
          if [ "$CHANGES" = true ] || [ "$pending" -gt 0 ]; then
            echo "::error::$WORKSPACE still plans changes after the apply, so it is not safe to merge. The comment above has the plan."
            exit 1
          fi
          echo "The plan is empty."

      - name: Say what actually happened
        id: outcome
        if: always()
        env:
          STATUS: ${{ job.status }}
          APPLY: ${{ steps.apply.outcome }}
          CLEAN: ${{ steps.clean.outcome }}
          POST: ${{ steps.post.outcome }}
          PLAN: ${{ steps.apply.outputs.json_plan_path }}
          SUBJECT: ${{ github.event.pull_request.html_url || github.ref_name }}
          ACTOR: ${{ steps.approver.outputs.by }}
        run: |
          title=Errored
          note=
          if [ "$POST" = failure ]; then
            note="$note - the update note was not posted, and the next apply's post carries it"
          fi
          if [ "$STATUS" = cancelled ]; then
            title=Cancelled
          elif [ "$APPLY" = success ] && [ "$CLEAN" = failure ]; then
            title='Applied, but still plans changes'
          elif [ "$APPLY" = success ]; then
            title=Applied
            if [ -n "$PLAN" ] && [ -f "$PLAN" ] &&
              [ "$(jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' "$PLAN")" = 0 ]; then
              title='No changes'
            fi
          fi
          {
            echo "title=$title"
            echo "description=$SUBJECT by $ACTOR$note"
          } >> "$GITHUB_OUTPUT"

      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708  # v1.16.0
        if: always()
        with:
          webhook: ${{ secrets.TOFU_DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "${{ matrix.workspace }}: ${{ steps.outcome.outputs.title }}"
          nodetail: true
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.outcome.outputs.description }}

      - name: Close the SSM session, which outlives the runner
        if: always() && startsWith(matrix.workspace, 'docker')
        env:
          AWS_REGION: ap-northeast-2
        run: |
          [ -s /tmp/ssm-session-id ] || { echo "No session was opened, so there is none to close."; exit 0; }
          sid=$(cat /tmp/ssm-session-id)
          aws ssm terminate-session --session-id "$sid" --output text \
            || echo "::warning::could not terminate $sid; it may have ended already."

  merge:
    needs: [apply, gate]
    if: needs.apply.result == 'success' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # An apply runs before the merge, so until the pull request lands the
      # default branch describes less than what is deployed, and the next apply
      # from any other branch takes production back to it. Every apply leg
      # succeeded, which now includes each one re-planning to nothing.
      - name: Merge the pull request this apply came from
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$(gh pr view "$PR" --repo "$REPO" --json merged --jq .merged)" = true ]; then
            echo "#$PR is already merged"
            exit 0
          fi
          # A draft cannot be merged at all, so an apply from one would leave
          # production ahead of the default branch with only the warning below
          # to say so, until the next apply from any other branch took it back.
          if [ "$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready "$PR" --repo "$REPO"
          fi
          # The gate has just reported, and branch protection can take a moment
          # to see it, so auto-merge waits out that moment
          gh pr merge "$PR" --repo "$REPO" --squash \
            || gh pr merge "$PR" --repo "$REPO" --squash --auto \
            || echo "::warning::could not merge #$PR; merge it by hand so the default branch matches what is deployed"

  log:
    needs: apply
    if: always() && github.event_name == 'pull_request' && needs.apply.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Keep each apply's output on the pull request, since run logs expire
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner, repo, run_id: context.runId, attempt_number: context.runAttempt,
            });
            for (const job of jobs.filter(j => j.name.endsWith(' apply'))) {
              const workspace = job.name.slice(0, -' apply'.length);
              let log;
              for (let tries = 5; log === undefined; tries--) {
                try {
                  log = String((await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: job.id })).data);
                } catch (error) {
                  if (tries === 1) throw error;
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
              }
              // The dflook step's own output, without its collapsed groups
              let inside = false, group = false;
              const lines = [];
              for (let line of log.split('\n')) {
                line = line.replace(/^\S+Z /, '');
                if (line.startsWith('##[group]Run ')) {
                  if (inside) break;
                  if (line.startsWith('##[group]Run dflook/tofu-apply@')) { inside = group = true; continue; }
                }
                if (!inside || line.startsWith('##[command]')) continue;
                if (line.startsWith('##[group]')) group = true;
                else if (line.startsWith('##[endgroup]')) group = false;
                else if (!group) lines.push(line);
              }
              if (!lines.length) {
                core.info(`${workspace}: the apply step left no output`);
                continue;
              }
              let text = lines.join('\n'), note = '';
              if (text.length > 60000) {
                text = text.slice(-60000).replace(/^.*\n/, '');
                note = ', the start cut to fit a comment';
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.issue.number,
                body: `**${workspace} apply: ${job.conclusion}** in [tofu #${context.runNumber}](${run})${note}\n\n`
                  + `<details><summary>Apply log</summary>\n\n\`\`\`\`\n${text}\n\`\`\`\`\n\n</details>`,
              });
              core.info(`${workspace}: posted the apply log`);
            }

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/collapse-comments

      - uses: ./.github/actions/collapse-comments
        with:
          pull-request: ${{ github.event.pull_request.number }}
