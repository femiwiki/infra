---
name: lint
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  tflint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef  # v6.3.1
        with:
          tflint_version: latest

      - run: tflint --recursive --config="$PWD/.tflint.hcl" --format=compact

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - run: shellcheck --version

      - run: git ls-files -z '*.sh' | xargs -0 shellcheck

  rumdl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: rvben/rumdl@bb84a49a85625b31ecf6c3e58b7bca7c75fbfefb  # v0.2.77
        with:
          version: 0.2.77

  yamllint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - run: uv run --frozen --group lint yamllint --strict .

  parallel-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # 2.37.2
        with:
          php-version: "8.3"
          tools: parallel-lint:1.4.0
          coverage: none

      - run: parallel-lint .

  taplo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91  # v2

      - run: taplo fmt --check

      - run: taplo lint

  caddyfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      # The caddy and the plugins the Seoul http container runs, and the port
      # variables the Caddyfile reads, which come from that image's ENV rather
      # than from caddy. `caddy validate` would go on to provision the s3
      # storage, which needs credentials, so this stops at adapting.
      - id: image
        run: echo "image=$(grep -m1 -oE 'ghcr\.io/femiwiki/femiwiki:[^"]+' docker-seoul/container.tf)" >> "$GITHUB_OUTPUT"

      # The image is 2.87 GB and holds a 95 MB static binary. Keyed on the tag,
      # so a new image pays the pull once and every pull request until the next
      # one restores about 40 MB instead.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        id: cache
        with:
          path: ~/.cache/fw-caddy
          key: fw-caddy-${{ steps.image.outputs.image }}

      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          mkdir -p ~/.cache/fw-caddy
          container=$(docker create "$IMAGE")
          docker cp "$container:/usr/bin/caddy" ~/.cache/fw-caddy/caddy
          docker rm -f "$container" > /dev/null
          # A wrapper with the ports baked in, so the step below needs no image
          # and nothing to source.
          {
            echo '#!/bin/sh'
            docker inspect "$IMAGE" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -E '^(PHP_FPM_LISTEN|PHP_FPM_PROBE_LISTEN|PHP_FPM_STATUS_LISTEN|FW_PROBE_PORT|FW_METRICS_PORT)=' \
              | sed 's/^/export /'
            # shellcheck disable=SC2016
            echo 'exec "$(dirname "$0")/caddy" "$@"'
          } > ~/.cache/fw-caddy/caddy-with-ports

      - name: Adapt and format the Caddyfile with that caddy
        run: |
          chmod +x ~/.cache/fw-caddy/caddy ~/.cache/fw-caddy/caddy-with-ports
          ~/.cache/fw-caddy/caddy-with-ports adapt --adapter caddyfile --config serving/Caddyfile > /dev/null
          # --diff prints the whole file, so show only the lines that differ
          if ! diff=$(~/.cache/fw-caddy/caddy-with-ports fmt --diff serving/Caddyfile); then
            grep -nE '^[-+]' <<< "$diff"
            echo "::error file=serving/Caddyfile::not formatted; run caddy fmt --overwrite"
            exit 1
          fi

  gate:
    name: lint gate
    needs: [tflint, shellcheck, rumdl, yamllint, parallel-lint, taplo, caddyfile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job this gate stands for has to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::$(echo "$failed" | paste -sd' ')"
            exit 1
          fi
          echo "All green."
