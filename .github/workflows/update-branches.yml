---
name: update branches
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: update-branches
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Merges come in bursts, and each update plans every open pull request
      # again, so a later merge cancels this run while it waits
      - name: Wait for the merges that follow
        if: github.event_name != 'schedule'
        run: sleep 180

      - name: The application token is what makes the checks run again
        id: secret
        env:
          APPLICATION_ID: ${{ vars.PAT_APPLICATION_ID }}
        run: |
          if [ -z "$APPLICATION_ID" ]; then
            echo "::warning::no application token, so nothing was updated"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: peter-murray/workflow-application-token-action@dad2b81e50ce3edeb5f3b7ffbd79f731368bd668  # v5.1.1
        id: token
        if: steps.secret.outputs.run == 'true'
        with:
          application_id: ${{ vars.PAT_APPLICATION_ID }}
          application_private_key: ${{ secrets.PAT_APPLICATION_PRIVATE_KEY }}

      # GitHub reports a pull request as behind only when the branch requires
      # it to be up to date, which main does not, so compare with main instead
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: steps.secret.outputs.run == 'true'
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { owner, repo } = context.repo
            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 })
            for (const pr of pulls) {
              // Dependabot stops rebasing a branch someone else has pushed to
              if (pr.draft || pr.user.login === 'dependabot[bot]' || pr.head.repo?.full_name !== `${owner}/${repo}`) continue
              const { data: { behind_by } } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `main...${pr.head.sha}`, per_page: 1,
              })
              if (behind_by === 0) continue
              try {
                await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number, expected_head_sha: pr.head.sha })
                core.info(`#${pr.number}: merged main, ${behind_by} commits ahead of it.`)
              } catch (e) {
                core.info(`#${pr.number}: left alone, ${e.message}`)
              }
            }
