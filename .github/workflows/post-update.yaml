---
name: post update
on:
  workflow_dispatch:
    inputs:
      pr:
        description: The pull request whose ```wikitext blocks to post, edited after the fact if need be.
        required: true
        type: number
      applied_at:
        description: When it was applied, in Asia/Seoul (2026-09-23 23:52). Empty for when it merged.
        required: false
        type: string
permissions: {}
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
          WIKI_DEPLOY_BOT_USER: ${{ vars.WIKI_DEPLOY_BOT_USER }}
          WIKI_DEPLOY_BOT_PASSWORD: ${{ secrets.WIKI_DEPLOY_BOT_PASSWORD }}
          APPLIED_AT: ${{ inputs.applied_at }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: .github/scripts/post-update.php "$REPO" "$PR"
