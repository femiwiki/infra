---
name: grafana plan
on:
  pull_request:
permissions: {}
jobs:
  plan:
    uses: ./.github/workflows/tofu-plan.yaml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      workspace: grafana
    secrets:
      grafana_auth: ${{ secrets.GRAFANA_PLAN_TOKEN }}
      discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # The required status check. Its name is written into branch protection, and
  # a job of a reusable workflow is checked in as "caller / callee", so this
  # one has to stay here.
  empty:
    name: grafana plan is empty
    needs: plan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/plan-gate
        with:
          workspace: grafana
          scope: ${{ needs.plan.outputs.scope }}
          result: ${{ needs.plan.result }}
          changes: ${{ needs.plan.outputs.changes }}
