---
name: grafana plan
on:
  pull_request:
    paths: ["grafana/**"]
permissions: {}
concurrency:
  group: grafana-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::302617221463:role/infra-grafana
          aws-region: ap-northeast-1

      - uses: dflook/tofu-plan@c7416238983bdd94c5486fb856bb7358f2bcc935  # v3.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TF_VAR_grafana_auth: ${{ secrets.GRAFANA_PLAN_TOKEN }}
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          path: grafana
