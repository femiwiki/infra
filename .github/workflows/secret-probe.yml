---
# Temporary: shows whether a review on a Dependabot pull request gets Actions secrets
name: secret probe
on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          HAS_SECRET: ${{ secrets.AWS_STATE_PASSPHRASE != '' }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: echo "actor=$ACTOR triggering=$TRIGGERING_ACTOR author=$AUTHOR has_secret=$HAS_SECRET"
