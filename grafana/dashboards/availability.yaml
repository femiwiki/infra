# Grafana takes this as JSON; the Terraform encodes it. A bare y reads as true where
# OpenTofu decodes this, so the panel coordinate stays quoted.
---
uid: availability
title: 페미위키 상태
description: |-
  지금 페미위키를 이용할 수 있는지, 지난 2주는 어땠는지 봅니다.
annotations:
  list:
  - builtIn: 1
    name: 사고
    type: dashboard
    datasource:
      type: grafana
      uid: '-- Grafana --'
    iconColor: rgba(255, 96, 96, 1)
    enable: true
    hide: false
tags:
- public
timezone: Asia/Seoul
schemaVersion: 39
editable: true
refresh: 5m
time:
  from: now-14d
  to: now
panels:
- id: 2
  type: stat
  title: 지금
  description: |-
    최근 5분 동안 Caddy가 끝낸 응답 가운데 5xx가 아닌 것이 99퍼센트를 넘으면 정상입니다.
  datasource: &prom
    type: prometheus
    uid: __PROM_UID__
  gridPos:
    h: 5
    w: 6
    x: 0
    'y': 0
  fieldConfig:
    defaults:
      noValue: 모름
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 1
      mappings:
      - type: value
        options:
          '1':
            text: 정상
            index: 0
          '0':
            text: 장애
            index: 1
    overrides: []
  options:
    colorMode: background
    graphMode: none
    justifyMode: center
    textMode: value
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
  targets:
  - refId: A
    datasource: *prom
    instant: true
    expr: |-
      sum(rate(caddy_http_request_duration_seconds_count{job="integrations/caddy", code!~"5.."}[5m]))
      /
      sum(rate(caddy_http_request_duration_seconds_count{job="integrations/caddy"}[5m]))
      >= bool 0.99
- id: 1
  type: state-timeline
  title: 지난 2주
  description: |-
    Caddy가 끝낸 응답 가운데 5xx가 아닌 것의 비율이 99퍼센트를 넘으면 초록, 아니면 빨강입니다. 비어 있는 구간은 잰 것이 없다는 뜻이고, 그때 서버가 어땠는지는 위의 달별 기록이 말합니다. 크롤러를 막은 403과 상한을 넘겨 돌려보낸 429는 실패로 세지 않습니다. 수치는 14일만 보관합니다.
  datasource: *prom
  gridPos:
    h: 5
    w: 18
    x: 6
    'y': 0
  fieldConfig:
    defaults:
      color:
        mode: thresholds
      thresholds:
        mode: absolute
        steps:
        - color: red
          value: null
        - color: green
          value: 1
      mappings:
      - type: value
        options:
          '1':
            text: 정상
            color: green
            index: 0
          '0':
            text: 장애
            color: red
            index: 1
      custom:
        fillOpacity: 100
        lineWidth: 0
    overrides: []
  options:
    mergeValues: true
    showValue: never
    alignValue: center
    rowHeight: 0.9
    perPage: 20
    legend:
      showLegend: false
      displayMode: list
      placement: bottom
    tooltip:
      mode: single
      sort: none
  targets:
  - refId: A
    datasource: *prom
    expr: |-
      sum(rate(caddy_http_request_duration_seconds_count{job="integrations/caddy", code!~"5.."}[$__rate_interval]))
      /
      sum(rate(caddy_http_request_duration_seconds_count{job="integrations/caddy"}[$__rate_interval]))
      >= bool 0.99
    legendFormat: 가용성
- id: 4
  type: stat
  title: 가용성
  description: |-
    지난 2주 동안 Caddy가 끝낸 응답 가운데 5xx가 아닌 것의 비율입니다. 9가 이어지는 동안은 그만큼 적고, 그 밖에는 소수점 첫째 자리에서 자릅니다. 올림하지 않으므로 적힌 값보다 낮았던 적은 없습니다.
  datasource: *prom
  gridPos:
    h: 3
    w: 6
    x: 0
    'y': 5
  fieldConfig:
    defaults:
      unit: percent
      decimals: 1
      max: 100
      color:
        mode: fixed
        fixedColor: text
      mappings:
      - type: regex
        options:
          pattern: '^(99\.9+)\d*$'
          result:
            text: $1%
            index: 0
      - type: regex
        options:
          pattern: '^(\d+\.\d)\d*$'
          result:
            text: $1%
            index: 1
      - type: regex
        options:
          pattern: '^(\d+)$'
          result:
            text: $1%
            index: 2
    overrides: []
  options:
    colorMode: none
    graphMode: none
    justifyMode: center
    textMode: value
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
  targets:
  - refId: A
    datasource: *prom
    instant: true
    expr: |-
      100 * sum(increase(caddy_http_request_duration_seconds_count{job="integrations/caddy", code!~"5.."}[$__range]))
      /
      sum(increase(caddy_http_request_duration_seconds_count{job="integrations/caddy"}[$__range]))
- id: 3
  type: text
  title: 사고 보고서
  gridPos:
    h: 3
    w: 18
    x: 6
    'y': 5
  options:
    mode: markdown
    content: |-
      [가용성](https://femiwiki.github.io/%EA%B0%80%EC%9A%A9%EC%84%B1.html)
