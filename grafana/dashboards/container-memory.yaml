# Grafana takes this as JSON; the Terraform encodes it. A bare y reads as true where
# OpenTofu decodes this, so the panel coordinate stays quoted.
---
uid: container-memory
title: 컨테이너 메모리
description: |-
  컨테이너마다 메모리를 얼마나 쓰는지, 호스트에는 얼마나 남았는지 봅니다.
tags:
- containers
timezone: browser
schemaVersion: 39
editable: true
refresh: 1m
time:
  from: now-6h
  to: now
panels:
- id: 1
  type: timeseries
  title: 컨테이너별 사용 중인 메모리
  description: |-
    커널이 메모리 상한에 견주어 세는 working set으로, docker stats가 보여주는 값과 같습니다. 상한이 있는 컨테이너는 상한 선도 함께 나옵니다.
  datasource: &prom
    type: prometheus
    uid: __PROM_UID__
  gridPos:
    h: 9
    w: 24
    x: 0
    'y': 0
  fieldConfig:
    defaults:
      unit: bytes
      min: 0
      custom:
        fillOpacity: 8
        lineWidth: 1
        showPoints: never
    overrides: []
  options:
    legend:
      displayMode: table
      placement: right
      calcs:
      - lastNotNull
      - max
    tooltip:
      mode: multi
      sort: desc
  targets:
  - refId: A
    datasource: *prom
    expr: |-
      container_memory_working_set_bytes{job="integrations/cadvisor"}
    legendFormat: '{{name}}'
  - refId: B
    datasource: *prom
    expr: |-
      container_spec_memory_limit_bytes{job="integrations/cadvisor"} != 0
    legendFormat: '{{name}} 상한'
- id: 2
  type: bargauge
  title: 컨테이너가 뜬 뒤 가장 많이 쓴 메모리
  description: |-
    cgroup v2의 memory.peak입니다. 컨테이너가 살아 있는 동안 줄지 않으므로, 상한은 이보다 낮게 잡을 수 없습니다.
  datasource: *prom
  gridPos:
    h: 8
    w: 12
    x: 0
    'y': 9
  fieldConfig:
    defaults:
      unit: bytes
      min: 0
      color:
        mode: continuous-BlYlRd
    overrides: []
  options:
    displayMode: gradient
    orientation: horizontal
    reduceOptions:
      calcs:
      - lastNotNull
      fields: ''
      values: false
  targets:
  - refId: A
    datasource: *prom
    expr: |-
      container_memory_max_usage_bytes{job="integrations/cadvisor"}
    instant: true
    legendFormat: '{{name}}'
- id: 3
  type: timeseries
  title: 상한 대비 사용량
  description: |-
    상한이 있는 컨테이너만 나옵니다.
  datasource: *prom
  gridPos:
    h: 8
    w: 12
    x: 12
    'y': 9
  fieldConfig:
    defaults:
      unit: percent
      min: 0
      max: 100
      custom:
        fillOpacity: 8
        lineWidth: 1
        showPoints: never
        thresholdsStyle:
          mode: dashed
      thresholds:
        mode: absolute
        steps:
        - color: green
          value: null
        - color: red
          value: 80
    overrides: []
  options:
    legend:
      displayMode: list
      placement: bottom
      calcs: []
    tooltip:
      mode: multi
      sort: desc
  targets:
  - refId: A
    datasource: *prom
    expr: |-
      100 * container_memory_working_set_bytes{job="integrations/cadvisor"} / (container_spec_memory_limit_bytes{job="integrations/cadvisor"} != 0)
    legendFormat: '{{name}}'
- id: 4
  type: timeseries
  title: 호스트에 남은 메모리와 Alloy가 쓰는 메모리
  description: |-
    위 컨테이너들은 호스트에 남은 메모리 안에서 돌아야 하고, Alloy도 그 메모리를 나눠 씁니다.
  datasource: *prom
  gridPos:
    h: 8
    w: 24
    x: 0
    'y': 17
  fieldConfig:
    defaults:
      unit: bytes
      min: 0
      custom:
        fillOpacity: 0
        lineWidth: 1
        showPoints: never
    overrides: []
  options:
    legend:
      displayMode: table
      placement: right
      calcs:
      - lastNotNull
      - min
    tooltip:
      mode: multi
      sort: desc
  targets:
  - refId: A
    datasource: *prom
    expr: |-
      node_memory_MemAvailable_bytes{job="integrations/node_exporter"}
    legendFormat: '{{instance}} 남음'
  - refId: B
    datasource: *prom
    expr: |-
      process_resident_memory_bytes{job="integrations/alloy-check"}
    legendFormat: '{{instance}} Alloy'
